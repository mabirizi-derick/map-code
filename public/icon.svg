<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="kyambogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0bce3b" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Outer Rounded Badge -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#kyambogoGrad)" filter="url(#shadow)" />
  <!-- Inner Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#ffffff" stroke-width="12" opacity="0.85" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="10 10" opacity="0.6" />
  
  <!-- Campus Academic Graduation Cap / Building Graphic -->
  <g transform="translate(136, 120) scale(1)">
    <!-- Mortarboard -->
    <polygon points="120,40 230,95 120,150 10,95" fill="#ffffff" />
    <path d="M50,118 L50,165 C50,195 190,195 190,165 L190,118 Z" fill="#ffffff" opacity="0.9" />
    <!-- Tassel -->
    <path d="M205,108 L220,160 L230,160 L215,108 Z" fill="#ffd700" />
    <circle cx="225" cy="165" r="7" fill="#ffd700" />
  </g>

  <!-- Navigation Compass Needle -->
  <g transform="translate(256, 320)">
    <polygon points="0,-60 25,10 0,0 -25,10" fill="#ea4335" />
    <polygon points="0,60 25,0 0,10 -25,0" fill="#1a73e8" />
    <circle cx="0" cy="5" r="9" fill="#ffffff" />
  </g>
</svg>
